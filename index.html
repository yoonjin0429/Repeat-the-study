<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - 밀도 중심 학습 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --accent-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* Card Base */
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }

        /* Navigation Tab Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px; background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-sub); background: none; border: none; font-size: 0.75rem;
            cursor: pointer; transition: 0.2s;
        }
        .nav-item.active { color: var(--primary-color); font-weight: 700; }
        .nav-icon { font-size: 1.25rem; }

        /* View Switching */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* --- HOME: Visual Celestial Clock --- */
        .clock-card {
            text-align: center; position: relative; overflow: hidden;
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            transition: background 1s ease;
        }
        
        .sky-orbit {
            width: 220px; height: 220px; border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.15); margin: 10px auto 20px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        .celestial-body {
            position: absolute; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .timer-display { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
        .timer-sub { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .btn-group { display: flex; justify-content: center; gap: 10px; }
        button {
            background-color: var(--primary-color); color: #fff; border: none;
            padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-sub { background-color: #334155; color: var(--text-main); }
        button.btn-sub:hover { background-color: #475569; }
        button.btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }

        /* --- HOME: To-Do Dashboard --- */
        .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .todo-input-group { display: flex; gap: 8px; margin-bottom: 14px; }
        input[type="text"], input[type="date"], input[type="number"] {
            background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; transition: all 0.2s;
        }
        input:focus { border-color: var(--primary-color); }
        
        .todo-list { display: flex; flex-direction: column; gap: 8px; }
        .todo-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: var(--input-bg); border-radius: 10px; border: 1px solid var(--border-color);
        }
        .todo-left { display: flex; align-items: center; gap: 10px; }
        .todo-item.done span { text-decoration: line-through; color: var(--text-sub); }

        /* --- 기존 진도 관리 UI 스타일 --- */
        .dday-header { display: flex; justify-content: space-between; align-items: center; }
        .dday-display { font-size: 1.6rem; font-weight: 700; color: var(--accent-gold); margin-top: 8px; }
        .dday-input-group { display: flex; gap: 8px; margin-top: 12px; }

        .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; background: var(--input-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); }
        .book-item { margin-top: 20px; border-bottom: 2px dashed var(--border-color); padding-bottom: 20px; }
        .book-item:last-child { border-bottom: none; }
        .book-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 700; }
        .read-count { background-color: rgba(99, 102, 241, 0.2); color: var(--primary-color); padding: 3px 10px; border-radius: 12px; font-size: 0.85rem; margin-left: 8px; }

        .progress-container { margin: 10px 0 16px 0; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .progress-bar-bg { background-color: #334155; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background-color: var(--primary-color); height: 100%; width: 0%; transition: width 0.3s ease; }

        .chapter-item { margin-left: 12px; margin-top: 14px; border-left: 2px solid var(--border-color); padding-left: 12px; }
        .chapter-header { font-size: 1rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
        .topic-item { margin-left: 12px; margin-top: 10px; background-color: var(--input-bg); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .topic-header { font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

        .badge-done { background-color: rgba(16, 185, 129, 0.2); color: var(--success-color); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .problem-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .problem-btn {
            width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--card-bg); color: var(--text-sub); font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: all 0.15s;
        }
        .problem-btn.active { background-color: var(--success-color); color: #fff; border-color: var(--success-color); font-weight: 700; }
    </style>
</head>
<body>

<div class="container">

    <!-- ==================== TAB 1: HOME VIEW ==================== -->
    <div id="viewHome" class="view-section active">
        <!-- Celestial Clock Card -->
        <div class="card clock-card" id="clockBg">
            <h2 style="font-size: 1.1rem; color: var(--text-sub);">오늘의 몰입 궤도</h2>
            
            <div class="sky-orbit">
                <div id="celestialBody" class="celestial-body">☀️</div>
                <div>
                    <div id="timerDisplay" class="timer-display">00:00:00</div>
                    <div class="timer-sub">목표 몰입 밀도 달성 중</div>
                </div>
            </div>

            <div class="btn-group">
                <button id="startBtn" onclick="toggleTimer()">집중 시작</button>
                <button class="btn-sub" onclick="resetTimer()">리셋</button>
            </div>
        </div>

        <!-- To-Do Dashboard Card -->
        <div class="card" style="margin-top: 20px;">
            <div class="todo-header">
                <h2>📋 오늘 내가 운용할 스케줄</h2>
                <span id="todoStats" style="font-size: 0.85rem; color: var(--text-sub);">0/0 완료</span>
            </div>

            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="오늘 완수할 프로젝트/할 일 입력..." style="flex: 1;">
                <button onclick="addTodo()">추가</button>
            </div>

            <div id="todoList" class="todo-list"></div>
        </div>
    </div>


    <!-- ==================== TAB 2: PROGRESS VIEW (기존 작성 코드) ==================== -->
    <div id="viewProgress" class="view-section">
        <div class="card" style="margin-bottom: 20px;">
            <div class="dday-header">
                <h2>🎯 목표 D-Day</h2>
                <button class="btn-sub" onclick="toggleDDayInput()">설정 변경</button>
            </div>
            <div id="ddayDisplay" class="dday-display">목표일을 설정해주세요.</div>
            <div id="ddayForm" class="dday-input-group" style="display: none;">
                <input type="text" id="ddayTitle" placeholder="목표 이름 (예: 수능/전공기말)" style="flex:1;">
                <input type="date" id="ddayDate">
                <button onclick="saveDDay()">저장</button>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 4px;">📚 회독 & 진도율 트래커</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px;">
                문제집과 주제별 문항 수를 기록하고 회독을 완성하세요.
            </p>

            <div class="add-form">
                <input type="text" id="inputBook" placeholder="문제집/과목 명" style="flex: 1; min-width: 120px;">
                <input type="text" id="inputChapter" placeholder="대단원" style="flex: 1; min-width: 120px;">
                <input type="text" id="inputTopic" placeholder="소단원/주제" style="flex: 1; min-width: 120px;">
                <input type="number" id="inputCount" placeholder="문항수" style="width: 75px;" min="1">
                <button onclick="addTopic()">추가</button>
            </div>

            <div id="bookTree"></div>
        </div>
    </div>

</div>

<!-- Navigation Bar -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')">
        <span class="nav-icon">☀️</span>
        <span>홈 & 타이머</span>
    </button>
    <button class="nav-item" onclick="switchTab('progress')">
        <span class="nav-icon">📚</span>
        <span>진도 관리</span>
    </button>
</nav>

<script>
    /* Global State */
    let state = {
        seconds: JSON.parse(localStorage.getItem('study_seconds')) || 0,
        todos: JSON.parse(localStorage.getItem('study_todos')) || [],
        dday: JSON.parse(localStorage.getItem('study_dday')) || { title: '', date: '' },
        books: JSON.parse(localStorage.getItem('study_books')) || []
    };

    let timerInterval = null;
    let isRunning = false;

    function saveData() {
        localStorage.setItem('study_seconds', JSON.stringify(state.seconds));
        localStorage.setItem('study_todos', JSON.stringify(state.todos));
        localStorage.setItem('study_dday', JSON.stringify(state.dday));
        localStorage.setItem('study_books', JSON.stringify(state.books));
        render();
    }

    /* Tab Switcher */
    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));

        if (tab === 'home') {
            document.querySelectorAll('.nav-item')[0].classList.add('active');
            document.getElementById('viewHome').classList.add('active');
        } else {
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            document.getElementById('viewProgress').classList.add('active');
        }
    }

    /* Celestial Stopwatch & Visual Sky Logic */
    function toggleTimer() {
        const btn = document.getElementById('startBtn');
        if (isRunning) {
            clearInterval(timerInterval);
            isRunning = false;
            btn.innerText = '집중 다시 시작';
            btn.style.backgroundColor = 'var(--primary-color)';
        } else {
            isRunning = true;
            btn.innerText = '일시 정지';
            btn.style.backgroundColor = 'var(--accent-gold)';
            timerInterval = setInterval(() => {
                state.seconds++;
                updateTimerDisplay();
                if (state.seconds % 5 === 0) saveData();
            }, 1000);
        }
    }

    function resetTimer() {
        if (confirm('오늘의 몰입 시간을 초기화하시겠습니까?')) {
            clearInterval(timerInterval);
            isRunning = false;
            state.seconds = 0;
            document.getElementById('startBtn').innerText = '집중 시작';
            document.getElementById('startBtn').style.backgroundColor = 'var(--primary-color)';
            saveData();
            updateTimerDisplay();
        }
    }

    function updateTimerDisplay() {
        const hrs = String(Math.floor(state.seconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((state.seconds % 3600) / 60)).padStart(2, '0');
        const secs = String(state.seconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;

        updateCelestialVisual();
    }

    function updateCelestialVisual() {
        const body = document.getElementById('celestialBody');
        const bg = document.getElementById('clockBg');
        
        // 12시간(43200초) 기준으로 궤도 회전 (0 ~ 180도)
        const maxSeconds = 43200; 
        const progress = Math.min(state.seconds / maxSeconds, 1);
        const angle = progress * 180; // 반원 일주 운동

        // 원형 궤도 상 위치 계산 (반지름 110px)
        const rad = (angle - 180) * (Math.PI / 180);
        const x = 110 * Math.cos(rad);
        const y = 110 * Math.sin(rad);

        body.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

        // 시간에 따른 하늘 색상 및 아이콘 변경 (낮 -> 노을 -> 밤)
        if (progress < 0.4) {
            body.innerText = '☀️';
            body.style.boxShadow = '0 0 20px #fbbf24';
            bg.style.background = 'linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%)'; // 푸른 낮
        } else if (progress < 0.8) {
            body.innerText = '🌅';
            body.style.boxShadow = '0 0 20px #f97316';
            bg.style.background = 'linear-gradient(180deg, #581c87 0%, #0f172a 100%)'; // 감성 노을
        } else {
            body.innerText = '🌙';
            body.style.boxShadow = '0 0 20px #38bdf8';
            bg.style.background = 'linear-gradient(180deg, #0284c7 0%, #0f172a 100%)'; // 밤하늘
        }
    }

    /* To-Do Logic */
    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        if (!text) return;
        state.todos.push({ text, done: false });
        input.value = '';
        saveData();
    }

    function toggleTodo(idx) {
        state.todos[idx].done = !state.todos[idx].done;
        saveData();
    }

    function deleteTodo(idx) {
        state.todos.splice(idx, 1);
        saveData();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        let completedCount = 0;

        state.todos.forEach((todo, idx) => {
            if (todo.done) completedCount++;
            const item = document.createElement('div');
            item.className = `todo-item ${todo.done ? 'done' : ''}`;
            item.innerHTML = `
                <div class="todo-left">
                    <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${idx})">
                    <span>${todo.text}</span>
                </div>
                <button class="btn-danger" onclick="deleteTodo(${idx})">삭제</button>
            `;
            list.appendChild(item);
        });

        document.getElementById('todoStats').innerText = `${completedCount}/${state.todos.length} 완료`;
    }

    /* D-Day Logic (기존 유지) */
    function toggleDDayInput() {
        const form = document.getElementById('ddayForm');
        form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    }

    function saveDDay() {
        const title = document.getElementById('ddayTitle').value;
        const date = document.getElementById('ddayDate').value;
        if (!title || !date) return alert('목표와 날짜를 입력해주세요.');
        state.dday = { title, date };
        toggleDDayInput();
        saveData();
    }

    function renderDDay() {
        const display = document.getElementById('ddayDisplay');
        if (!state.dday.date) {
            display.innerText = '목표일을 설정해주세요.';
            return;
        }
        const target = new Date(state.dday.date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        target.setHours(0, 0, 0, 0);

        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        const dDayStr = diff === 0 ? 'D-Day' : diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
        display.innerText = `${state.dday.title} : ${dDayStr}`;
    }

    /* Book & Problem Logic (기존 작성해주신 핵심 기능 완벽 유지) */
    function addTopic() {
        const bookName = document.getElementById('inputBook').value.trim();
        const chapterName = document.getElementById('inputChapter').value.trim();
        const topicName = document.getElementById('inputTopic').value.trim();
        const count = parseInt(document.getElementById('inputCount').value);

        if (!bookName || !chapterName || !topicName || isNaN(count) || count < 1) {
            return alert('모든 항목을 입력해주세요.');
        }

        let book = state.books.find(b => b.name === bookName);
        if (!book) {
            book = { name: bookName, readCount: 0, chapters: [] };
            state.books.push(book);
        }

        let chapter = book.chapters.find(c => c.name === chapterName);
        if (!chapter) {
            chapter = { name: chapterName, topics: [] };
            book.chapters.push(chapter);
        }

        const problems = Array.from({ length: count }, () => false);
        chapter.topics.push({ name: topicName, problems });

        document.getElementById('inputTopic').value = '';
        document.getElementById('inputCount').value = '';

        saveData();
    }

    function toggleProblem(bIdx, cIdx, tIdx, pIdx) {
        const topic = state.books[bIdx].chapters[cIdx].topics[tIdx];
        topic.problems[pIdx] = !topic.problems[pIdx];
        checkCompletions(bIdx);
        saveData();
    }

    function checkCompletions(bIdx) {
        const book = state.books[bIdx];
        let totalProblems = 0;
        let solvedProblems = 0;

        book.chapters.forEach(chapter => {
            chapter.topics.forEach(topic => {
                totalProblems += topic.problems.length;
                solvedProblems += topic.problems.filter(p => p).length;
            });
        });

        if (totalProblems > 0 && totalProblems === solvedProblems) {
            book.readCount += 1;
            book.chapters.forEach(chapter => {
                chapter.topics.forEach(topic => {
                    topic.problems = topic.problems.map(() => false);
                });
            });
            alert(`🎉 [${book.name}] 모든 문항을 완료하여 ${book.readCount}회독 달성! 기록이 초기화되어 다음 회독을 시작합니다.`);
        }
    }

    function deleteBook(bIdx) {
        if (confirm('이 문제집 전체를 삭제하시겠습니까?')) {
            state.books.splice(bIdx, 1);
            saveData();
        }
    }

    function deleteTopic(bIdx, cIdx, tIdx) {
        if (confirm('이 소단원을 삭제하시겠습니까?')) {
            const book = state.books[bIdx];
            const chapter = book.chapters[cIdx];
            chapter.topics.splice(tIdx, 1);
            if (chapter.topics.length === 0) book.chapters.splice(cIdx, 1);
            if (book.chapters.length === 0) state.books.splice(bIdx, 1);
            saveData();
        }
    }

    /* Overall Render Function */
    function render() {
        updateTimerDisplay();
        renderTodos();
        renderDDay();

        const tree = document.getElementById('bookTree');
        tree.innerHTML = '';

        state.books.forEach((book, bIdx) => {
            const bookEl = document.createElement('div');
            bookEl.className = 'book-item';

            let totalProblems = 0;
            let solvedProblems = 0;
            let chaptersHtml = '';

            book.chapters.forEach((chapter, cIdx) => {
                let topicsHtml = '';
                let isChapterDone = chapter.topics.length > 0;

                chapter.topics.forEach((topic, tIdx) => {
                    const topicTotal = topic.problems.length;
                    const topicSolved = topic.problems.filter(p => p).length;
                    totalProblems += topicTotal;
                    solvedProblems += topicSolved;

                    const isTopicDone = topicTotal > 0 && topicTotal === topicSolved;
                    if (!isTopicDone) isChapterDone = false;

                    const gridHtml = topic.problems.map((done, pIdx) => `
                        <div class="problem-btn ${done ? 'active' : ''}" 
                             onclick="toggleProblem(${bIdx}, ${cIdx}, ${tIdx}, ${pIdx})">
                            ${pIdx + 1}
                        </div>
                    `).join('');

                    topicsHtml += `
                        <div class="topic-item">
                            <div class="topic-header">
                                <div>
                                    <strong>주제 ${tIdx + 1}.</strong> ${topic.name}
                                    ${isTopicDone ? '<span class="badge-done">소단원 완료</span>' : ''}
                                </div>
                                <button class="btn-danger" onclick="deleteTopic(${bIdx}, ${cIdx}, ${tIdx})">삭제</button>
                            </div>
                            <div class="problem-grid">${gridHtml}</div>
                        </div>
                    `;
                });

                chaptersHtml += `
                    <div class="chapter-item">
                        <div class="chapter-header">
                            <span>(${cIdx + 1}) ${chapter.name}</span>
                            ${isChapterDone ? '<span class="badge-done">대단원 완료</span>' : ''}
                        </div>
                        ${topicsHtml}
                    </div>
                `;
            });

            const percent = totalProblems > 0 ? Math.round((solvedProblems / totalProblems) * 100) : 0;

            bookEl.innerHTML = `
                <div class="book-header">
                    <div>
                        ${bIdx + 1}) ${book.name} 
                        <span class="read-count">${book.readCount}회독</span>
                    </div>
                    <button class="btn-danger" onclick="deleteBook(${bIdx})">삭제</button>
                </div>

                <div class="progress-container">
                    <div class="progress-info">
                        <span>진도율 (${solvedProblems} / ${totalProblems} 문항)</span>
                        <span>${percent}%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                    </div>
                </div>

                ${chaptersHtml}
            `;
            tree.appendChild(bookEl);
        });
    }

    render();
</script>

</body>
</html>
